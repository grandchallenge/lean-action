name: ShellCheck
on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        - name: Run ShellCheck
          uses: azohra/shell-linter@30a9cf3f6cf25c08fc98f10d7dc4167f7b5c0c00
